#
# Trino MCP surface override for the Gravitino playground.
#
# Adds the tuannvm/mcp-trino server as an HTTP endpoint published on host port
# 8001, giving an MCP client a direct natural-language SQL path to the
# playground's Trino coordinator. Compose with the base file:
#
#   docker compose -f docker-compose.yaml -f docker-trino-mcp-override.yaml \
#     -p gravitino-playground up --detach
#
# This path talks to Trino directly and is not subject to Gravitino's
# authorization. It is the fast query lane, distinct from the governed metadata
# lane the Gravitino MCP server provides. Point any MCP client at
# http://localhost:8001/mcp.
#
services:
  trino-mcp:
    image: ghcr.io/tuannvm/mcp-trino:latest
    container_name: playground-trino-mcp
    environment:
      - TRINO_HOST=trino
      - TRINO_PORT=8080
      - TRINO_USER=trino
      - TRINO_SCHEME=http
      - MCP_TRANSPORT=http
      - MCP_PORT=8080
    ports:
      - "8001:8080"
    depends_on:
      trino:
        condition: service_healthy


