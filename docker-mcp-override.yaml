#
# MCP surface override for the Gravitino playground.
#
# Adds the Gravitino MCP server as an HTTP endpoint published on host port 8000.
# Compose with the base file:
#
#   docker compose -f docker-compose.yaml -f docker-mcp-override.yaml \
#     -p gravitino-playground up --detach
#
# The container image supports only HTTP transport (not stdio), which is exactly
# what is wanted here. In HTTP mode the server forwards each incoming request's
# Authorization header verbatim to Gravitino, so the same service works both in
# the default anonymous playground and with the auth override enabled: no MCP
# config change is needed between the two. Point any MCP client at
# http://localhost:8000/mcp.
#
services:
  gravitino-mcp:
    image: apache/gravitino-mcp-server:${GRAVITINO_MCP_IMAGE_TAG:-1.3.0}
    container_name: playground-gravitino-mcp
    command:
      - --metalake
      - metalake_demo
      - --gravitino-uri
      - http://gravitino:8090
      - --transport
      - http
      - --mcp-url
      - http://0.0.0.0:8000/mcp
    ports:
      - "8000:8000"
    volumes:
      - ./healthcheck:/tmp/healthcheck
    depends_on:
      gravitino:
        condition: service_healthy
    healthcheck:
      # 'Started' only means the process launched; this reports true readiness
      # (the /mcp endpoint answering) so the MCP service shows 'Healthy' like the
      # other governed services. Uses python (guaranteed in the image), not curl.
      test: ["CMD", "python", "/tmp/healthcheck/mcp-healthcheck.py"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
